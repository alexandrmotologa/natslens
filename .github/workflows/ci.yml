name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package.json

      - name: Build Frontend
        working-directory: ./ui
        run: |
          npm ci
          npm run build

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -ldflags="-s -w" -o natslens .
