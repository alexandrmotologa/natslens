<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="emerald-jet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyan-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="obsidian-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="lens-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Border / Frame -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" />

  <g clip-path="url(#squircle-clip)">
    <!-- Dark Tech Canvas Interior -->
    <rect x="36" y="36" width="952" height="952" rx="208" fill="url(#obsidian-grad)" />

    <!-- Ambient Glow Center -->
    <circle cx="512" cy="512" r="320" fill="url(#glow-grad)" />

    <!-- Technical Grid & Concentric JetStream Buffer Rings -->
    <g opacity="0.25" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8">
      <circle cx="512" cy="512" r="380" fill="none" />
      <circle cx="512" cy="512" r="280" fill="none" />
      <circle cx="512" cy="512" r="180" fill="none" />
      <line x1="132" y1="512" x2="892" y2="512" />
      <line x1="512" y1="132" x2="512" y2="892" />
    </g>

    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">
      <!-- Outer JetStream Orbiting Ring -->
      <circle cx="0" cy="0" r="230" fill="none" stroke="url(#cyan-lens)" stroke-width="14" stroke-dasharray="140 30 70 30" opacity="0.85" />

      <!-- High-Speed Message Vector Stream Tracks -->
      <path d="M -320 -120 L -120 -120 L 0 0 L 120 0 L 320 0" fill="none" stroke="#10b981" stroke-width="8" opacity="0.4" stroke-linecap="round" />
      <path d="M -320 120 L -120 120 L 0 0 L 120 0 L 320 0" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4" stroke-linecap="round" />

      <!-- Center Hexagonal Optical Prism (Observability Lens) -->
      <polygon points="
        0,-160
        138.5,-80
        138.5,80
        0,160
        -138.5,80
        -138.5,-80
      " fill="#0f172a" stroke="url(#emerald-jet)" stroke-width="16" stroke-linejoin="round" />

      <!-- Stylized N-Fold Beam Refraction (NATS 'N' + Lens Refraction) -->
      <path d="M -75 80 L -75 -80 L 75 80 L 75 -80" 
            fill="none" 
            stroke="url(#emerald-jet)" 
            stroke-width="26" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            filter="url(#lens-glow)" />

      <!-- Focal Laser Vector Beams Crossing Center -->
      <line x1="-220" y1="0" x2="-140" y2="0" stroke="#34d399" stroke-width="10" stroke-linecap="round" />
      <circle cx="-140" cy="0" r="7" fill="#34d399" />

      <line x1="140" y1="0" x2="220" y2="0" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
      <circle cx="140" cy="0" r="7" fill="#38bdf8" />

      <!-- Optical Core Center Pulse -->
      <circle cx="0" cy="0" r="22" fill="#34d399" opacity="0.9" filter="url(#lens-glow)" />
      <circle cx="0" cy="0" r="10" fill="#ffffff" />
    </g>
  </g>
</svg>
